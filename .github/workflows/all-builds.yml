# .github/workflows/flet-build-ghcli.yml
name: Flet Build GH-CLI
on:
  workflow_dispatch:
    inputs:
      build_version:
        description: "版本号（留空则用 pyproject.toml / git tag）"
        required: false
        default: ""
      build_number:
        description: "构建号（留空则用 github run number）"
        required: false
        default: ""
  push:
    tags:
      - "v*"

env:
  UV_PYTHON: "3.13"
  PYTHONUTF8: "1"
  FLET_CLI_NO_RICH_OUTPUT: "1"

jobs:
  windows:
    name: BuildWindows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv sync --locked

      - name: Build Flet Windows
        shell: bash
        run: |
          set -euo pipefail
          # 版本号优先级：手动输入 > tag > 空
          if [[ -n "${{ github.event.inputs.build_version }}" ]]; then
            VER="${{ github.event.inputs.build_version }}"
          elif [[ $GITHUB_REF == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/v}"
          else
            VER=""
          fi

          if [[ -n "${{ github.event.inputs.build_number }}" ]]; then
            BNUM="${{ github.event.inputs.build_number }}"
          else
            BNUM="${GITHUB_RUN_NUMBER}"
          fi

          ARGS=("flet" "build" "windows" "--yes")
          [[ -n "$VER" ]] && ARGS+=("--build-version" "$VER")
          [[ -n "$BNUM" ]] && ARGS+=("--build-number" "$BNUM")
          uv run "${ARGS[@]}"

      - name: Upload workflow artifact
        # if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v5
        with:
          name: MyApp-win-x64
          path: build/windows
          if-no-files-found: error
