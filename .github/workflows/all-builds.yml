# .github/workflows/flet-build.yml
name: Flet Build
on:
  workflow_dispatch:
    inputs:
      build_version:
        description: "版本号（留空则用 pyproject.toml / git tag）"
        required: false
        default: ""
      build_number:
        description: "构建号（留空则用 github run number）"
        required: false
        default: ""
  push:
    tags:
      - "v*"

env:
  UV_PYTHON: "3.13"
  PYTHONUTF8: "1"
  FLET_CLI_NO_RICH_OUTPUT: "1"

jobs:
  # ========== Job 1: 构建 Windows 包 ==========
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv sync --locked

      - name: Build Flet Windows
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${{ github.event.inputs.build_version }}" ]]; then
            VER="${{ github.event.inputs.build_version }}"
          elif [[ $GITHUB_REF == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/v}"
          else
            VER=""
          fi

          if [[ -n "${{ github.event.inputs.build_number }}" ]]; then
            BNUM="${{ github.event.inputs.build_number }}"
          else
            BNUM="${GITHUB_RUN_NUMBER}"
          fi

          ARGS=("flet" "build" "windows" "--yes")
          [[ -n "$VER" ]] && ARGS+=("--build-version" "$VER")
          [[ -n "$BNUM" ]] && ARGS+=("--build-number" "$BNUM")
          uv run "${ARGS[@]}"

      # - name: List build output
      #   shell: bash
      #   run: ls -la build/windows/

      # 关键：把 zip 上传为 workflow artifact
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v5
        with:
          name: windows-package
          path: build/windows
          if-no-files-found: error
          retention-days: 7

  # ========== Job 2: 下载 artifact 并发布 Release ==========
  release:
    name: Release
    needs: build-windows          # 必须等 build-windows 完成
    runs-on: ubuntu-latest        # 用 Linux runner，快且便宜，只做下载+上传
    if: startsWith(github.ref, 'refs/tags/')   # 只有 tag 推送才发布
    permissions:
      contents: write             # 创建 Release + 上传资产
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v5
        with:
          name: windows-package
          path: artifacts          # 下载到 ./artifacts/ 目录

      # - name: List downloaded files
      #   run: ls -la artifacts/

      - name: Create Release & Upload zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG_NAME="${GITHUB_REF#refs/tags/v}"
          ZIP_FILE=$(find artifacts -maxdepth 1 -name "*.zip" | head -n1)
          echo "Uploading: $ZIP_FILE"

          if [[ ! -f "$ZIP_FILE" ]]; then
            echo "ERROR: zip not found in artifacts/"
            exit 1
          fi

          # 创建 Release（已存在则跳过创建）
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" \
              --title "$TAG_NAME" \
              --generate-notes
          fi

          # 上传 zip 资产，--clobber 覆盖同名旧文件
          gh release upload "$TAG_NAME" "$ZIP_FILE" --clobber
