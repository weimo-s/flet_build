# .github/workflows/flet-build.yml
name: Flet Build
on:
  workflow_dispatch: # 手动触发，可自定义版本号/构建号
    inputs:
      build_version:
        description: "版本号（留空优先读取pyproject.toml，tag触发自动取tag）"
        required: false
        default: ""
      build_number:
        description: "构建号（留空默认使用GitHub Run Number）"
        required: false
        default: ""
  push:
    tags:
      - "v*" # git push tag v0.1.0 自动触发打包发布

env:
  UV_PYTHON: "3.13"
  PYTHONUTF8: "1"
  FLET_CLI_NO_RICH_OUTPUT: "1"

jobs:
  windows:
    name: BuildWindows
    runs-on: windows-latest
    permissions:
      contents: write # 必须，用来创建Release并上传附件
      actions: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Build Flet Windows package
        shell: bash
        run: |
          set -euo pipefail

          # 版本号优先级：手动输入 > tag名称(去掉v) > 留空交给flet自动读取pyproject
          if [[ -n "${{ github.event.inputs.build_version }}" ]]; then
            VER="${{ github.event.inputs.build_version }}"
          elif [[ $GITHUB_REF == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/v}"
          else
            VER=""
          fi

          # 构建号优先级：手动输入 > GITHUB_RUN_NUMBER
          if [[ -n "${{ github.event.inputs.build_number }}" ]]; then
            BNUM="${{ github.event.inputs.build_number }}"
          else
            BNUM="${GITHUB_RUN_NUMBER}"
          fi

          # 组装flet build参数
          ARGS=("flet" "build" "windows" "--yes")
          if [[ -n "$VER" ]]; then
            ARGS+=("--build-version" "$VER")
          fi
          if [[ -n "$BNUM" ]]; then
            ARGS+=("--build-number" "$BNUM")
          fi

          uv run "${ARGS[@]}"
      - name: Upload build artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v5
        with:
          name: MyApp-win-x64
          path: build/windows/MyApp-win-x64.zip
          if-no-files-found: error

      - name: Release with just-release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/just-release@v1
        with:
            tag: ${{ github.ref_name }}
        env:
            GITHUB_TOKEN: ${{ github.token }}
