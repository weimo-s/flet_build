# docs: https://docs.flet.dev/publish/#github-actions/

name: Flet Build

on:
  workflow_dispatch: # 支持手动触发，可指定版本号/构建号
    inputs:
      build_version:
        description: "版本号（留空则用 pyproject.toml 里的 version 或 git tag）"
        required: false
        default: ""
      build_number:
        description: "构建号（留空则用 github run number）"
        required: false
        default: ""
  push:
    tags:
      - "v*" # 打 Tag 自动触发（如 git tag v0.1.0）

env:
  UV_PYTHON: "3.13" # 与本地 Python 版本保持一致
  PYTHONUTF8: "1"   # 防止 Windows 构建时控制台编码报错
  FLET_CLI_NO_RICH_OUTPUT: "1" # 关掉 CI 日志的 rich 进度条，便于排查

jobs:
  windows:
    name: BuildWindows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv sync --locked
      - name: BuildEXE
        shell: bash
        run: |
          set -euo pipefail
          uv run flet build windows --yes \
            --build-version "${GITHUB_REF_NAME#v}"
            --build-number "$GITHUB_RUN_NUMBER"
      - uses: actions/upload-artifact@v5.0.0
        with:
          name: windows-build-artifact
          path: build/windows
          if-no-files-found: error
  
