# .github/workflows/flet-build.yml
name: Flet Build
on:
  workflow_dispatch:
    inputs:
      build_version:
        description: "版本号（留空则用 pyproject.toml / git tag）"
        required: false
        default: ""
      build_number:
        description: "构建号（留空则用 github run number）"
        required: false
        default: ""
  push:
    tags:
      - "v*"

env:
  UV_PYTHON: "3.13"
  PYTHONUTF8: "1"
  FLET_CLI_NO_RICH_OUTPUT: "1"

jobs:
  # ========== Job 1: 构建 Windows 包 ==========
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv sync --locked

      - name: Build Flet Windows
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${{ github.event.inputs.build_version }}" ]]; then
            VER="${{ github.event.inputs.build_version }}"
          elif [[ $GITHUB_REF == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/v}"
          else
            VER=""
          fi

          if [[ -n "${{ github.event.inputs.build_number }}" ]]; then
            BNUM="${{ github.event.inputs.build_number }}"
          else
            BNUM="${GITHUB_RUN_NUMBER}"
          fi

          ARGS=("flet" "build" "windows" "--yes")
          [[ -n "$VER" ]] && ARGS+=("--build-version" "$VER")
          [[ -n "$BNUM" ]] && ARGS+=("--build-number" "$BNUM")
          uv run "${ARGS[@]}"
          
      # 1. Flet build 完成后，本地生成zip包（给Release用）
      - name: Zip build folder for Release
        shell: bash
        run: |
          cd build/windows
          zip -r MyApp-win-x64.zip .

      # 2. 上传整个目录作为CI工件（你现在这段不变）
      - uses: actions/upload-artifact@v5.0.0
        with:
          name: windows-build-artifact
          path: build/windows
          if-no-files-found: error

      # 3. tag触发时，把本地生成的zip上传到Release
      - name: Create Release & Attach zip
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/windows/MyApp-win-x64.zip
          generate_release_notes: true
    


